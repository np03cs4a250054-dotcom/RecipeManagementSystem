<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up</title>
<link rel="stylesheet" href="css/signup.css" />
</head>
<body>

  <div class="card">
    <div class="form-side">
      <h1>Create your account</h1>
      <p class="subtext">Already have an account? <a href="login1.html">Sign in here</a></p>

      <form id="signupForm" action="" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" />
        </div>

        <div class="field">
          <label for="confirmPassword">Retype Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" />
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="agree" name="agree" />
          <p>By signing up you agree to receive updates and special offers.</p>
        </div>

        <button type="submit">Create account</button>
        <p id="message" style="text-align:center; margin: 16px 0 0; font-size: 13.5px; min-height: 18px;"></p>
      </form>
    </div>

    

  <script src="js/singup.js"></script>
</body>
</html>
