<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in</title>
<link rel="stylesheet" href="css/signin.css" />
</head>
<body>

  <div class="card">
    <div class="form-side">
      <h1>Welcome back</h1>
      <p class="subtext">Don't have an account? <a href="signup.html">Sign up here</a></p>

      <form id="loginForm" action="" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" />
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="remember" name="remember" />
          <p>Remember me on this device.</p>
        </div>

        <button type="submit">Log in</button>
        <p id="message" style="text-align:center; margin: 16px 0 0; font-size: 13.5px; min-height: 18px;"></p>

        <p class="subtext" style="text-align:center; margin-top:12px; margin-bottom:0;">
          <a href="#">Forgot your password?</a>
        </p>
      </form>
    </div>

    

  <script src="js/signin.js"></script>
</body>
</html>
